[package]
name = "bpm3"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
autobins = false

[[bin]]
name = "bpm"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
serde_json = "1"
